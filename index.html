<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Isgro Crew Quest Board</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF6B6B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Quest Board">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --ashton: #FF6B6B;
    --ashton-light: #FFE5E5;
    --autumn: #A78BFA;
    --autumn-light: #EDE9FE;
    --logan: #34D399;
    --logan-light: #D1FAE5;
    --gold: #FBBF24;
    --bg: #0a0a1a;
    --card: #12122a;
    --text: #e8e8ff;
    --muted: #8888bb;
    --radius: 8px;
    --neon-pink: #ff2d78;
    --neon-cyan: #00f5ff;
    --neon-green: #39ff14;
    --neon-yellow: #ffe600;
    --scanline: rgba(0,0,0,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        var(--scanline) 2px,
        var(--scanline) 4px
      ),
      radial-gradient(ellipse at 50% 0%, rgba(0,245,255,0.07) 0%, transparent 60%),
      radial-gradient(ellipse at 0% 100%, rgba(255,45,120,0.07) 0%, transparent 60%),
      radial-gradient(ellipse at 100% 100%, rgba(167,139,250,0.07) 0%, transparent 60%);
    min-height: 100vh;
    min-height: 100dvh;
    padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    color: var(--text);
  }

  /* ── HEADER ── */
  header {
    text-align: center;
    padding: 28px 20px 16px;
    position: relative;
  }

  .header-console {
    display: inline-block;
    background: #0d0d22;
    border: 3px solid var(--neon-cyan);
    border-radius: 6px;
    padding: 18px 30px 14px;
    box-shadow:
      0 0 10px var(--neon-cyan),
      0 0 30px rgba(0,245,255,0.2),
      inset 0 0 20px rgba(0,245,255,0.04);
    position: relative;
  }

  .header-console::before {
    content: '● ● ●';
    position: absolute;
    top: 6px; left: 10px;
    font-size: 0.68rem;
    color: var(--neon-cyan);
    letter-spacing: 3px;
    opacity: 0.5;
  }

  .header-console::after {
    content: 'v1.0';
    position: absolute;
    top: 6px; right: 10px;
    font-family: 'Press Start 2P', monospace;
    font-size: 1rem;
    color: var(--neon-cyan);
    opacity: 0.5;
  }

  header h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(1.1rem, 4.5vw, 1.8rem);
    color: #ffffff;
    text-shadow:
      2px 2px 0px var(--neon-cyan),
      -1px -1px 0px var(--neon-cyan);
    line-height: 1.6;
    margin-bottom: 6px;
    letter-spacing: 2px;
  }

  @keyframes flicker {
    0%,95%,100% { opacity: 1; }
    96% { opacity: 0.7; }
    97% { opacity: 1; }
    98% { opacity: 0.5; }
    99% { opacity: 1; }
  }

  header p {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.62rem;
    color: var(--neon-pink);
    text-shadow: 0 0 8px var(--neon-pink);
    letter-spacing: 1px;
    margin-top: 4px;
  }

  /* ── WEEK NAV ── */
  .week-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 20px auto;
    max-width: 400px;
  }

  .week-nav button {
    background: #0d0d22;
    border: 2px solid var(--neon-cyan);
    border-radius: 4px;
    width: 38px;
    height: 38px;
    font-size: 1.3rem;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
    color: var(--neon-cyan);
    box-shadow: 0 0 8px rgba(0,245,255,0.3);
  }
  .week-nav button:hover {
    background: var(--neon-cyan);
    color: #000;
    box-shadow: 0 0 16px var(--neon-cyan);
  }

  .week-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.68rem;
    color: var(--neon-yellow);
    text-shadow: 0 0 6px var(--neon-yellow);
    min-width: 200px;
    text-align: center;
    line-height: 1.8;
  }

  /* ── SCOREBOARD ── */
  .scoreboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 900px;
    margin: 0 auto 28px;
  }

  .score-card {
    border-radius: var(--radius);
    padding: 16px 12px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s;
    border: 2px solid;
  }
  .score-card:hover { transform: translateY(-3px); }

  .score-card.ashton {
    background: #1a0a0a;
    border-color: var(--ashton);
    box-shadow: 0 0 12px rgba(255,107,107,0.4), inset 0 0 20px rgba(255,107,107,0.05);
  }
  .score-card.autumn {
    background: #120a1a;
    border-color: var(--autumn);
    box-shadow: 0 0 12px rgba(167,139,250,0.4), inset 0 0 20px rgba(167,139,250,0.05);
  }
  .score-card.logan {
    background: #0a1a10;
    border-color: var(--logan);
    box-shadow: 0 0 12px rgba(52,211,153,0.4), inset 0 0 20px rgba(52,211,153,0.05);
  }

  .score-avatar {
    display: flex;
    justify-content: center;
    margin-bottom: 6px;
    animation: float 3s ease-in-out infinite;
  }
  .score-avatar svg { image-rendering: pixelated; }
  .score-card.autumn .score-avatar { animation-delay: 0.5s; }
  .score-card.logan .score-avatar  { animation-delay: 1s; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  .score-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.82rem;
    letter-spacing: 1px;
    line-height: 1.8;
  }
  .score-card.ashton .score-name { color: var(--ashton); text-shadow: 0 0 6px var(--ashton); }
  .score-card.autumn .score-name { color: var(--autumn); text-shadow: 0 0 6px var(--autumn); }
  .score-card.logan  .score-name { color: var(--logan);  text-shadow: 0 0 6px var(--logan); }

  .score-age {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .score-points {
    font-family: 'Press Start 2P', monospace;
    font-size: 1.5rem;
    line-height: 1;
  }
  .score-card.ashton .score-points { color: var(--ashton); text-shadow: 0 0 10px var(--ashton); }
  .score-card.autumn .score-points { color: var(--autumn); text-shadow: 0 0 10px var(--autumn); }
  .score-card.logan  .score-points { color: var(--logan);  text-shadow: 0 0 10px var(--logan); }

  .score-points span { font-size: 1rem; opacity: 0.7; }

  .score-badge {
    position: absolute;
    top: 8px; right: 8px;
    font-size: 1.3rem;
  }

  .progress-bar-wrap {
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    height: 6px;
    margin-top: 8px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .progress-bar {
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s ease;
    animation: glow-bar 2s ease-in-out infinite alternate;
  }
  .score-card.ashton .progress-bar { background: var(--ashton); box-shadow: 0 0 6px var(--ashton); }
  .score-card.autumn .progress-bar { background: var(--autumn); box-shadow: 0 0 6px var(--autumn); }
  .score-card.logan  .progress-bar { background: var(--logan);  box-shadow: 0 0 6px var(--logan); }

  @keyframes glow-bar {
    from { opacity: 0.7; } to { opacity: 1; }
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .tab-btn {
    padding: 8px 18px;
    border-radius: 4px;
    border: 2px solid #333355;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.62rem;
    cursor: pointer;
    transition: all 0.15s;
    background: #0d0d22;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  .tab-btn.active.ashton, .tab-btn:hover.ashton { background: #1a0808; color: var(--ashton); border-color: var(--ashton); box-shadow: 0 0 10px rgba(255,107,107,0.5); }
  .tab-btn.active.autumn, .tab-btn:hover.autumn { background: #0e0818; color: var(--autumn); border-color: var(--autumn); box-shadow: 0 0 10px rgba(167,139,250,0.5); }
  .tab-btn.active.logan,  .tab-btn:hover.logan  { background: #081408; color: var(--logan);  border-color: var(--logan);  box-shadow: 0 0 10px rgba(52,211,153,0.5); }
  .tab-btn.active.all,    .tab-btn:hover.all    { background: #0d0d22; color: var(--neon-cyan); border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,245,255,0.4); }

  /* ── CHORES ── */
  .chores-container { max-width: 900px; margin: 0 auto; }

  .day-section { margin-bottom: 20px; }

  .day-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 1rem;
    color: var(--neon-yellow);
    text-shadow: 0 0 6px var(--neon-yellow);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
    padding-left: 4px;
    border-left: 3px solid var(--neon-yellow);
    padding-left: 10px;
  }

  .chore-list { display: flex; flex-direction: column; gap: 6px; }

  .chore-item {
    background: #0e0e24;
    border-radius: 6px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid #1e1e40;
    border-left: 4px solid;
    transition: all 0.2s ease;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .chore-item::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.1) 3px, rgba(0,0,0,0.1) 4px);
    pointer-events: none;
  }

  .chore-item.ashton { border-left-color: var(--ashton); }
  .chore-item.autumn { border-left-color: var(--autumn); }
  .chore-item.logan  { border-left-color: var(--logan); }

  .chore-item:hover { transform: translateX(3px); }
  .chore-item.ashton:hover { box-shadow: 0 0 10px rgba(255,107,107,0.2); background: #1a0a0a; }
  .chore-item.autumn:hover { box-shadow: 0 0 10px rgba(167,139,250,0.2); background: #12091a; }
  .chore-item.logan:hover  { box-shadow: 0 0 10px rgba(52,211,153,0.2);  background: #091409; }

  .chore-item.done { opacity: 0.45; }
  .chore-item.done .chore-text { text-decoration: line-through; color: var(--muted); }

  .chore-check {
    width: 26px; height: 26px;
    border-radius: 3px;
    border: 2px solid #333355;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 1.05rem;
    font-family: 'Press Start 2P', monospace;
    transition: all 0.2s;
  }
  .chore-item.ashton.done .chore-check { background: var(--ashton); border-color: var(--ashton); color: #000; box-shadow: 0 0 8px var(--ashton); }
  .chore-item.autumn.done .chore-check { background: var(--autumn); border-color: var(--autumn); color: #000; box-shadow: 0 0 8px var(--autumn); }
  .chore-item.logan.done  .chore-check { background: var(--logan);  border-color: var(--logan);  color: #000; box-shadow: 0 0 8px var(--logan); }

  .chore-emoji { font-size: 1.5rem; }

  .chore-info { flex: 1; }
  .chore-text { font-family: 'Press Start 2P', monospace; font-size: 0.68rem; color: var(--text); line-height: 1.8; letter-spacing: 0.5px; }
  .chore-sub  { font-family: 'Press Start 2P', monospace; font-size: 0.68rem; color: var(--muted); margin-top: 4px; line-height: 1.8; }

  .chore-meta { display: flex; align-items: center; gap: 6px; }

  .chore-pts {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.68rem;
    padding: 4px 8px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .chore-item.ashton .chore-pts { background: rgba(255,107,107,0.15); color: var(--ashton); border: 1px solid rgba(255,107,107,0.3); }
  .chore-item.autumn .chore-pts { background: rgba(167,139,250,0.15); color: var(--autumn); border: 1px solid rgba(167,139,250,0.3); }
  .chore-item.logan  .chore-pts { background: rgba(52,211,153,0.15);  color: var(--logan);  border: 1px solid rgba(52,211,153,0.3); }

  /* ── KID GROUPS ── */
  .kid-group { margin-bottom: 14px; }

  .kid-group-label {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.68rem;
    padding: 6px 12px;
    border-radius: 3px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .kid-group-label svg { image-rendering: pixelated; flex-shrink: 0; }
  .ashton-label { background: rgba(255,107,107,0.15); color: var(--ashton); border: 1px solid rgba(255,107,107,0.4); text-shadow: 0 0 6px var(--ashton); }
  .autumn-label { background: rgba(167,139,250,0.15); color: var(--autumn); border: 1px solid rgba(167,139,250,0.4); text-shadow: 0 0 6px var(--autumn); }
  .logan-label  { background: rgba(52,211,153,0.15);  color: var(--logan);  border: 1px solid rgba(52,211,153,0.4);  text-shadow: 0 0 6px var(--logan); }

  /* ── REWARDS ── */
  .rewards-section {
    max-width: 900px;
    margin: 28px auto 0;
    background: #0e0e24;
    border-radius: var(--radius);
    padding: 22px;
    border: 2px solid var(--neon-pink);
    box-shadow: 0 0 16px rgba(255,45,120,0.2), inset 0 0 20px rgba(255,45,120,0.03);
  }

  .rewards-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.95rem;
    color: var(--neon-pink);
    text-shadow: 0 0 8px var(--neon-pink);
    margin-bottom: 16px;
    letter-spacing: 1px;
  }

  .rewards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
  }

  .reward-card {
    border: 1px solid #222244;
    border-radius: 6px;
    padding: 12px 8px;
    text-align: center;
    transition: all 0.2s;
    background: #0a0a1e;
  }

  .reward-card.unlocked {
    border-color: var(--neon-yellow);
    box-shadow: 0 0 12px rgba(255,230,0,0.3);
    animation: pulse-gold 2s ease-in-out infinite;
    background: #141408;
  }

  @keyframes pulse-gold {
    0%, 100% { box-shadow: 0 0 8px rgba(255,230,0,0.2); }
    50% { box-shadow: 0 0 20px rgba(255,230,0,0.5); }
  }

  .reward-card.ashton-reward { border-color: rgba(255,107,107,0.3); }
  .reward-card.autumn-reward { border-color: rgba(167,139,250,0.3); }
  .reward-card.logan-reward  { border-color: rgba(52,211,153,0.3); }
  .reward-card.unlocked.ashton-reward { border-color: var(--ashton); box-shadow: 0 0 12px rgba(255,107,107,0.4); background: #1a0808; }
  .reward-card.unlocked.autumn-reward { border-color: var(--autumn); box-shadow: 0 0 12px rgba(167,139,250,0.4); background: #0e0818; }
  .reward-card.unlocked.logan-reward  { border-color: var(--logan);  box-shadow: 0 0 12px rgba(52,211,153,0.4);  background: #081408; }

  .reward-icon { font-size: 2rem; margin-bottom: 4px; }
  .reward-name { font-weight: 800; font-size: 1rem; color: var(--text); line-height: 1.3; }
  .reward-pts  { font-family: 'Press Start 2P', monospace; font-size: 0.68rem; color: var(--neon-yellow); margin-top: 3px; text-shadow: 0 0 4px var(--neon-yellow); }
  .reward-who  { font-size: 1.3rem; color: var(--muted); font-weight: 700; margin-top: 2px; }

  .rewards-divider {
    grid-column: 1 / -1;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.62rem;
    color: var(--muted);
    padding: 8px 0 4px;
    border-top: 1px dashed #333355;
    margin-top: 4px;
    letter-spacing: 1px;
  }

  /* ── CONFETTI ── */
  .confetti-wrap {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 999; overflow: hidden;
  }

  .confetti-piece {
    position: absolute; top: -20px;
    width: 10px; height: 10px;
    border-radius: 2px;
    animation: confetti-fall 1.2s ease-in forwards;
    opacity: 0;
  }

  @keyframes confetti-fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #0d0d22;
    border: 2px solid var(--neon-cyan);
    border-radius: 4px;
    padding: 10px 22px;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.68rem;
    color: var(--neon-cyan);
    text-shadow: 0 0 6px var(--neon-cyan);
    box-shadow: 0 0 16px rgba(0,245,255,0.3);
    z-index: 1000;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── RESET BUTTON ── */
  .reset-btn {
    display: block;
    margin: 20px auto 0;
    padding: 10px 22px;
    border-radius: 4px;
    background: #0d0d22;
    border: 2px solid #333355;
    font-family: 'Press Start 2P', monospace;
    font-weight: 400;
    font-size: 0.62rem;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.5px;
  }
  .reset-btn:hover { border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: 0 0 10px rgba(255,45,120,0.3); }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  @media (max-width: 600px) {
    .scoreboard { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .score-points { font-size: 1rem; }
    .score-name { font-size: 0.68rem; }
    body { padding: 12px; }
  }
</style>
</head>
<body>

<div class="confetti-wrap" id="confetti"></div>

<div class="toast" id="toast"></div>

<header>
  <div class="header-console">
    <h1>ISGRO CREW</h1>
    <p>★ QUEST BOARD ★</p>
  </div>
</header>

<div class="week-nav">
  <button onclick="changeWeek(-1)">◀</button>
  <div class="week-label" id="weekLabel"></div>
  <button onclick="changeWeek(1)">▶</button>
</div>

<!-- SCOREBOARD -->
<div class="scoreboard" id="scoreboard"></div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn all active" onclick="filterBy('all', this)">🏠 All</button>
  <button class="tab-btn ashton" onclick="filterBy('ashton', this)">🔥 Ashton</button>
  <button class="tab-btn autumn" onclick="filterBy('autumn', this)">🌸 Autumn</button>
  <button class="tab-btn logan"  onclick="filterBy('logan', this)">🛡️ Logan</button>
</div>

<!-- CHORES -->
<div class="chores-container" id="choresContainer"></div>

<!-- REWARDS -->
<div class="rewards-section">
  <div class="rewards-title">🏆 Reward Store</div>
  <div class="rewards-grid" id="rewardsGrid"></div>
</div>

<button class="reset-btn" onclick="resetWeek()">🔄 Reset This Week's Quests</button>

<script>
const KIDS = {
  ashton: { name: 'Ashton', age: 13, emoji: '⚔️', color: '#FF6B6B' },
  autumn: { name: 'Autumn', age: 12, emoji: '🪄', color: '#A78BFA' },
  logan:  { name: 'Logan',  age: 7,  emoji: '🛡️', color: '#34D399' }
};

// Minecraft-style pixel head SVGs per kid
function mcHead(who, size = 48) {
  const heads = {

    // ── ASHTON = CREEPER ──
    // Green face, dark forehead, iconic creeper eyes & mouth
    ashton: `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 8 8" shape-rendering="crispEdges">
      <!-- base green face -->
      <rect x="1" y="0" width="6" height="7" fill="#4A7C3F"/>
      <!-- darker forehead band -->
      <rect x="1" y="0" width="6" height="1" fill="#2D5A22"/>
      <!-- darker shading sides -->

function getWeekKey() {
  const now = new Date();
  now.setDate(now.getDate() + weekOffset * 7);
  const startOfYear = new Date(now.getFullYear(), 0, 1);
  const weekNum = Math.ceil(((now - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);
  return `week_${now.getFullYear()}_${weekNum}`;
}

function getWeekNumber() {
  const now = new Date();
  now.setDate(now.getDate() + weekOffset * 7);
  const startOfYear = new Date(now.getFullYear(), 0, 1);
  return Math.ceil(((now - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);
}

// Rotating chores: cook a meal alternates Ashton → Autumn → Ashton → ...
// Make school lunch alternates Ashton → Autumn → Ashton → ...
// Logan is too young for cooking duty but cheers them on 🌿
function getRotatingChores() {
  const wk = getWeekNumber();
  const cookKid   = wk % 2 === 0 ? 'ashton' : 'autumn'; // alternates each week
  const lunchKid  = wk % 2 === 0 ? 'autumn' : 'ashton'; // opposite kid each week

function loadState() {
  const key = getWeekKey();
  const saved = localStorage.getItem(key);
  state = saved ? JSON.parse(saved) : {};
}

function saveState() {
  localStorage.setItem(getWeekKey(), JSON.stringify(state));
}

function getMonthKey() {
  const now = new Date();
  now.setDate(now.getDate() + weekOffset * 7);
  return `month_${now.getFullYear()}_${now.getMonth()}`;
}

function isRedeemed(rewardId) {
  return !!localStorage.getItem(`redeemed_${getMonthKey()}_${rewardId}`);
}

function markRedeemed(rewardId) {
  localStorage.setItem(`redeemed_${getMonthKey()}_${rewardId}`, Date.now());
}

function getMonthlyPoints(who) {
  // Sum points across ALL weeks in the current viewed month
  const now = new Date();
  now.setDate(now.getDate() + weekOffset * 7);
  const yr = now.getFullYear();
  const mo = now.getMonth();
  let total = 0;

  // Scan all localStorage keys for weeks in this month
  for (let key in localStorage) {
    if (!key.startsWith('week_')) continue;
    const parts = key.split('_'); // week_YYYY_WW
    if (parts.length !== 3) continue;

    // Try to figure out what month week number falls in
    const weekYear = parseInt(parts[1]);
    const weekNum  = parseInt(parts[2]);
    if (weekYear !== yr) continue;

    // Get first day of that ISO week
    const jan1 = new Date(weekYear, 0, 1);
    const weekStart = new Date(jan1);
    weekStart.setDate(jan1.getDate() + (weekNum - 1) * 7 - jan1.getDay() + 1);
    if (weekStart.getMonth() !== mo) continue;

    // Count completed chores for this kid in this week
    const weekState = JSON.parse(localStorage.getItem(key) || '{}');
    const allChores = [...CHORES, ...getRotatingChores()];
    allChores.forEach(c => {
      if (c.who === who && weekState[key + '_' + c.id]) {
        total += c.pts;
      }
    });
  }

  // Also add current week's state (may not be saved yet)
  const wk = getWeekKey();
  const allChores = [...CHORES, ...getRotatingChores()];
  allChores.forEach(c => {
    if (c.who === who && state[wk + '_' + c.id]) {
      total += c.pts;
    }
  });

  return total;
}

function getDaysLeftInMonth() {
  const now = new Date();
  const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
  return lastDay.getDate() - now.getDate();
}

function getMonthName() {
  const now = new Date();
  now.setDate(now.getDate() + weekOffset * 7);
  return now.toLocaleString('default', { month: 'long' });
}

function getPoints(who) {
  const allChores = [...CHORES, ...getRotatingChores()];
  return allChores
    .filter(c => c.who === who && state[getWeekKey() + '_' + c.id])
    .reduce((sum, c) => sum + c.pts, 0);
}

function getTotalPossible(who) {
  const allChores = [...CHORES, ...getRotatingChores()];
  return allChores.filter(c => c.who === who).reduce((sum, c) => sum + c.pts, 0);
}

function getBadge(pts) {
  if (pts >= 200) return BADGES[7];
  if (pts >= 150) return BADGES[6];
  if (pts >= 100) return BADGES[5];
  if (pts >= 70)  return BADGES[4];
  if (pts >= 50)  return BADGES[3];
  if (pts >= 30)  return BADGES[2];
  if (pts >= 10)  return BADGES[1];
  return BADGES[0];
}

  const dayOrder = getDayOrder();
  const wk = getWeekKey();

  const allChores = [...CHORES, ...getRotatingChores()];
  const filtered = currentFilter === 'all' ? allChores : allChores.filter(c => c.who === currentFilter);
  const grouped = {};
  dayOrder.forEach(d => { grouped[d] = filtered.filter(c => c.day === d); });

  container.innerHTML = dayOrder.map(day => {
    const items = grouped[day];
    if (!items.length) return '';

    let innerHtml = '';
    if (currentFilter === 'all') {
      const kidOrder = ['ashton', 'autumn', 'logan'];
      innerHtml = kidOrder.map(kid => {
        const kidItems = items.filter(c => c.who === kid);
        if (!kidItems.length) return '';
        return `
          <div class="kid-group">
            <div class="kid-group-label ${kid}-label">${mcHead(kid, 20)} ${KIDS[kid].name}</div>
            <div class="chore-list">
              ${kidItems.map(c => choreRow(c, wk)).join('')}
            </div>
          </div>`;
      }).join('');
    } else {
      innerHtml = `<div class="chore-list">${items.map(c => choreRow(c, wk)).join('')}</div>`;
    }

    return `
      <div class="day-section">
        <div class="day-label">${getDayEmoji(day)} ${capitalize(day)}</div>

  }).join('');
}

  const familyRewards = REWARDS.filter(r => r.who === 'all');

    html += familyRewards.map(r => renderCard(r, maxPts)).join('');
  } else if (familyRewards.length && currentFilter !== 'all') {
    const kidPts = pts[currentFilter] || 0;
    html += `<div style="grid-column:1/-1;font-family:'Press Start 2P',monospace;font-size:0.62rem;color:#ffe600;text-shadow:0 0 6px #ffe600;padding:10px 0 4px;border-top:1px dashed #333355;margin-top:10px;letter-spacing:1px">🏠 FAMILY REWARDS</div>`;
    html += familyRewards.map(r => renderCard(r, kidPts)).join('');
  }

  grid.innerHTML = html;
}

    box-shadow: 0 0 0 3px ${neon}, 0 0 30px ${neon}88, 0 0 60px ${neon}33;
    font-family: 'Nunito', sans-serif;
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
  `;

  // Scanline overlay inside popup
  popup.innerHTML = `
    <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.15) 3px,rgba(0,0,0,0.15) 4px);pointer-events:none;z-index:1"></div>

    <div style="position:relative;z-index:2">
      <div style="font-family:'Press Start 2P',monospace;font-size:0.62rem;color:${neon};letter-spacing:2px;margin-bottom:10px;text-shadow:0 0 6px ${neon};opacity:0.7">
        ★ ISGRO CREW ★ ACHIEVEMENT UNLOCKED ★
      </div>

      <div style="margin-bottom:8px">${mcHead(who, 56)}</div>

      <div style="font-family:'Press Start 2P',monospace;font-size:1rem;color:${neon};line-height:1.8;margin-bottom:10px;text-shadow:0 0 10px ${neon}">
        ${msg.top}
      </div>

      <div style="width:100%;margin:10px 0;border:2px solid ${neon}44;border-radius:6px;background:#050510;padding:14px 10px;text-align:center">
        <div style="font-family:'Press Start 2P',monospace;font-size:0.55rem;color:${neon};opacity:0.7;margin-bottom:6px;letter-spacing:1px">QUEST VALUE</div>
        <div style="font-family:'Press Start 2P',monospace;font-size:1.4rem;color:${neon};text-shadow:0 0 12px ${neon}">+${pts} ⭐</div>
        <div style="font-family:'Press Start 2P',monospace;font-size:0.5rem;color:#8888bb;margin-top:6px">POINTS EARNED</div>
      </div>

      <div style="font-size:1.1rem;font-weight:700;color:#8888bb;margin-bottom:12px;line-height:1.5">${msg.bottom}</div>

      <button id="popup-close-btn"
        style="background:${neon};color:#000;border:none;border-radius:4px;padding:12px 28px;font-family:'Press Start 2P',monospace;font-size:0.75rem;cursor:pointer;width:100%;letter-spacing:1px;box-shadow:0 0 12px ${neon}88;transition:all 0.15s">
        [ LET'S GO! 🔥 ]
      </button>
    </div>
  `;

  const overlay = document.createElement('div');
  overlay.id = 'popup-overlay';
  overlay.style.cssText = `
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.7);z-index:1000;
    backdrop-filter:blur(4px);
  `;

  const closePopup = () => {
    popup.remove();
    overlay.remove();
  };
  overlay.onclick = closePopup;
  document.body.appendChild(overlay);
  document.body.appendChild(popup);

  document.getElementById('popup-close-btn').onclick = closePopup;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      popup.style.opacity = '1';
      popup.style.transform = 'translate(-50%, -50%) scale(1)';
    });
  });

  // Auto-dismiss after 6s
  setTimeout(() => {
    if (document.getElementById('slang-popup')) closePopup();
  }, 6000);
}

function filterBy(who, btn) {
  currentFilter = who;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderChores();
}

function changeWeek(dir) {
  weekOffset += dir;
  loadState();
  renderAll();
  renderWeekLabel();
}

function renderWeekLabel() {
  const now = new Date();
  now.setDate(now.getDate() + weekOffset * 7);
  const start = new Date(now);
  start.setDate(now.getDate() - now.getDay() + 1);
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  const opts = { month: 'short', day: 'numeric' };
  document.getElementById('weekLabel').textContent =
    `${weekOffset === 0 ? 'This Week · ' : ''}${start.toLocaleDateString('en-CA', opts)} – ${end.toLocaleDateString('en-CA', opts)}`;
}

function resetWeek() {
  if (!confirm('Reset all chores for this week? Points will go back to 0.')) return;
  const wk = getWeekKey();
  Object.keys(state).forEach(k => { if (k.startsWith(wk)) delete state[k]; });
  saveState();
  renderAll();
}

function renderAll() {
  renderScoreboard();
  renderChores();
  renderRewards();
}

function launchConfetti(color) {
  const wrap = document.getElementById('confetti');
  const colors = [color, '#FBBF24', '#F9FAFB', '#ffffff'];
  for (let i = 0; i < 22; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = (20 + Math.random() * 60) + '%';
    el.style.top = '-20px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.width = (8 + Math.random() * 8) + 'px';
    el.style.height = (8 + Math.random() * 8) + 'px';
    el.style.animationDelay = (Math.random() * 0.4) + 's';
    el.style.animationDuration = (0.9 + Math.random() * 0.6) + 's';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// Init
loadState();
renderWeekLabel();
renderAll();

// Register Service Worker for PWA / offline support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('✅ Quest Board SW registered'))
      .catch(err => console.warn('SW registration failed:', err));
  });
}

// iOS install hint (shown once)
window.addEventListener('load', () => {
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone;
  const dismissed = localStorage.getItem('install-hint-dismissed');
  if (isIOS && !isStandalone && !dismissed) {
    const banner = document.createElement('div');
    banner.style.cssText = `
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
      background:#1E1B4B; color:white; border-radius:16px;
      padding:14px 20px; font-family:'Nunito',sans-serif; font-size:0.85rem;
      font-weight:700; max-width:320px; width:calc(100% - 40px);
      text-align:center; z-index:9999; box-shadow:0 8px 30px rgba(0,0,0,0.25);
      animation: slideUp 0.4s ease;
    `;
    banner.innerHTML = `📲 Add to Home Screen!<br><span style="font-weight:600;opacity:0.85">Tap the Share button <b>⬆</b> then <b>"Add to Home Screen"</b></span><br><button onclick="localStorage.setItem('install-hint-dismissed','1');this.parentElement.remove()" style="margin-top:10px;background:rgba(255,255,255,0.15);border:none;color:white;padding:6px 18px;border-radius:20px;font-family:'Nunito',sans-serif;font-weight:700;cursor:pointer;">Got it ✓</button>`;
    document.body.appendChild(banner);
  }
});
</script>
